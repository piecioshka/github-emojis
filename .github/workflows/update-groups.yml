name: Update emoji groups

on:
  schedule:
    # At 04:00 UTC on the 1st day of every month
    - cron: "0 4 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Regenerate data/groups.json
        run: node scripts/generate-groups.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- data/groups.json; then
            echo "No changes in emoji groups"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/groups.json
          git commit -m "chore: update emoji groups"
          git push
